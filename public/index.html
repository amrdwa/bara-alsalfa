<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>برا السالفة 🎭</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #273c75, #111827 55%, #050505);
      color: white;
    }
    .container {
      width: min(92%, 520px);
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 25px;
      padding: 30px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .chat-layout {
      width: min(95%, 900px);
      display: flex;
      gap: 20px;
    }
    @media (max-width: 768px) {
      .chat-layout { flex-direction: column; }
    }
    h1 { font-size: 38px; margin: 0 0 10px; }
    .subtitle { color: #cbd5e1; margin-bottom: 25px; }
    input {
      width: 100%; padding: 15px; border-radius: 12px;
      border: none; outline: none; font-size: 18px;
      text-align: center; margin-bottom: 12px;
    }
    button {
      width: 100%; padding: 15px; margin-top: 10px;
      border: none; border-radius: 12px; background: #5865f2;
      color: white; font-size: 18px; font-weight: bold; cursor: pointer;
    }
    button:hover { background: #4752c4; }
    .secondary { background: #374151; }
    .secondary:hover { background: #4b5563; }
    .spectate-btn { background: #059669; }
    .vote-trigger-btn { background: #eab308; color: black; margin-bottom: 15px; }
    .vote-trigger-btn:hover { background: #ca8a04; }
    .hidden { display: none !important; }
    .room-code { font-size: 42px; font-weight: bold; letter-spacing: 8px; color: #60a5fa; margin: 20px 0; }
    .players { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
    .player { padding: 12px; background: rgba(255,255,255,0.08); border-radius: 10px; }
    .status { margin: 15px 0; color: #cbd5e1; }
    .role { font-size: 28px; margin: 25px 0; padding: 25px; border-radius: 20px; background: rgba(255,255,255,0.08); }
    .animal { font-size: 48px; margin-top: 15px; }
    .error { color: #f87171; margin-top: 15px; }
    .box-container { margin-top: 15px; padding: 15px; background: rgba(255, 255, 255, 0.05); border-radius: 15px; }

    .chat-main { flex: 2; }
    .sidebar { flex: 1; text-align: right; }
    
    .chat-box {
      height: 300px;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 15px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 15px;
    }

    .chat-msg {
      align-self: flex-start;
      max-width: 80%;
      background: rgba(255, 255, 255, 0.12);
      padding: 10px 14px;
      border-radius: 15px 15px 15px 2px;
      word-break: break-word;
      font-size: 15px;
      text-align: right;
    }
    .chat-msg .sender-name {
      font-weight: bold;
      color: #60a5fa;
      font-size: 13px;
      margin-bottom: 3px;
      display: block;
    }

    .chat-msg.my-msg {
      align-self: flex-end;
      background: #2563eb;
      border-radius: 15px 15px 2px 15px;
      text-align: left;
    }

    .chat-input-container { display: flex; gap: 10px; }
    .chat-input-container input { margin-bottom: 0; text-align: right; }
    .chat-input-container button { margin-top: 0; width: 100px; flex-shrink: 0; }

    .sidebar-player {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.08);
      padding: 10px 12px;
      border-radius: 10px;
      margin-bottom: 10px;
      font-size: 14px;
    }
    .sidebar-controls { display: flex; gap: 5px; }
    .btn-ctrl {
      padding: 5px 8px;
      font-size: 12px;
      border-radius: 6px;
      margin-top: 0;
      width: auto;
    }
    .btn-allow { background: #10b981; }
    .btn-mute { background: #ef4444; }

    .votes-box {
      margin-top: 15px;
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
      padding: 10px;
      font-size: 13px;
    }
    .vote-item {
      padding: 6px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .vertical-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 20px 0;
    }
    .vertical-list button {
      margin-top: 0;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .vertical-list button:hover:not(:disabled) {
      background: #2563eb;
    }

    .correct-btn { background: #10b981 !important; color: white !important; }
    .wrong-btn { background: #ef4444 !important; color: white !important; }

    /* أنماط جدول النقاط والمتصدرين */
    .score-card {
      background: rgba(255, 255, 255, 0.08);
      padding: 12px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .score-badge {
      background: #2563eb;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 13px;
    }
    .score-total {
      color: #facc15;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- الشاشة الرئيسية -->
  <div class="container" id="home">
    <h1>🎭 برا السالفة</h1>
    <div class="subtitle">لعبة جماعية بين الأصدقاء</div>

    <input id="nameInput" type="text" placeholder="اكتب اسمك" maxlength="20">

    <button id="showCreateBtn">🏠 إنشاء غرفة</button>
    <div id="createBox" class="box-container hidden">
      <input id="pinInput" type="password" placeholder="🔐 كلمة سر المالك">
      <button id="createBtn">تأكيد وإنشاء الغرفة</button>
    </div>

    <button id="showJoinBtn" class="secondary">🔑 دخول إلى غرفة</button>
    <div id="joinBox" class="box-container hidden">
      <input id="roomInput" type="text" placeholder="كود الغرفة" maxlength="4">
      <button id="joinBtn">دخول كـ لاعب</button>
    </div>

    <button id="showSpectateBtn" class="spectate-btn">👁️ مشاهدة لعبة</button>
    <div id="spectateBox" class="box-container hidden">
      <input id="spectateRoomInput" type="text" placeholder="كود اللعبة" maxlength="4">
      <button id="spectateBtn" class="spectate-btn">دخول للمشاهدة 👁️</button>
    </div>

    <div id="homeMessage" class="error"></div>
  </div>

  <!-- غرفة الانتظار -->
  <div class="container hidden" id="lobby">
    <h1>🏠 الغرفة</h1>
    <div id="roomCode" class="room-code"></div>
    <h3>👥 اللاعبين</h3>
    <div id="players" class="players"></div>
    <div id="hostControls" class="hidden">
      <button id="startBtn">🚀 ابدأ اللعبة</button>
    </div>
    <div id="lobbyMessage" class="error"></div>
  </div>

  <!-- شاشة الدور -->
  <div class="container hidden" id="roleScreen">
    <h1>🔒 دورك</h1>
    <div id="roleBox" class="role"></div>
    <button id="hideRoleBtn">👀 فهمت</button>
  </div>

  <!-- شاشة المحادثة والتحكم -->
  <div class="container chat-layout hidden" id="chatScreen">
    <div class="sidebar">
      <h3>👥 اللاعبين</h3>
      <div id="sidebarPlayers"></div>

      <div class="votes-box">
        <strong>🗳️ التصويت الحقيقي:</strong>
        <div id="votesList">لم يبدأ التصويت بعد</div>
      </div>
    </div>

    <div class="chat-main">
      <h1>💬 المحادثة</h1>
      <button id="hostVoteBtn" class="vote-trigger-btn hidden">🗳️ بدء التصويت الآن</button>
      <div id="chatBox" class="chat-box"></div>

      <div class="chat-input-container" id="chatInputArea">
        <input id="msgInput" type="text" placeholder="اكتب رسالتك..." maxlength="100">
        <button id="sendMsgBtn">إرسال</button>
      </div>
      <div id="chatError" class="error"></div>
    </div>
  </div>

  <!-- شاشة اختيار التصويت -->
  <div class="container hidden" id="voteScreen">
    <h1>🗳️ مين تتوقع برا السالفة؟</h1>
    <div class="status">اختر شخص واحد يشك فيه الجميع:</div>
    <div id="voteOptions" class="vertical-list"></div>
  </div>

  <!-- شاشة التخمين النهائي للحيوانات -->
  <div class="container hidden" id="guessScreen">
    <h1 id="guessTitle">🎯 التخمين النهائي</h1>
    <div id="outsiderRevealBanner" class="status"></div>
    <div class="status" id="guessStatus"></div>

    <div id="animalChoices" class="vertical-list"></div>
  </div>

  <!-- واجهة لوحة النقاط والمتصدرين الجديدة -->
  <div class="container hidden" id="scoreScreen">
    <h1>🏆 لوحة النقاط المتراكمة</h1>
    <div id="scoreStatus" class="status"></div>

    <div id="scoresList" style="margin: 20px 0;"></div>

    <button id="readyNextBtn">✅ أكمل جولة ثانية</button>
    
    <!-- زر للمالك فقط لبدء الجولة بدون المنتظرين -->
    <button id="hostForceStartBtn" class="vote-trigger-btn hidden" style="margin-top:10px;">⚡ بدء الجولة فوراً (تجاوز المتأخرين)</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    const home = document.getElementById("home");
    const lobby = document.getElementById("lobby");
    const roleScreen = document.getElementById("roleScreen");
    const chatScreen = document.getElementById("chatScreen");
    const voteScreen = document.getElementById("voteScreen");
    const guessScreen = document.getElementById("guessScreen");
    const scoreScreen = document.getElementById("scoreScreen");

    const nameInput = document.getElementById("nameInput");
    const pinInput = document.getElementById("pinInput");
    const roomInput = document.getElementById("roomInput");

    const showCreateBtn = document.getElementById("showCreateBtn");
    const createBox = document.getElementById("createBox");
    const createBtn = document.getElementById("createBtn");

    const showJoinBtn = document.getElementById("showJoinBtn");
    const joinBox = document.getElementById("joinBox");
    const joinBtn = document.getElementById("joinBtn");

    const showSpectateBtn = document.getElementById("showSpectateBtn");
    const spectateBox = document.getElementById("spectateBox");
    const spectateRoomInput = document.getElementById("spectateRoomInput");
    const spectateBtn = document.getElementById("spectateBtn");

    const startBtn = document.getElementById("startBtn");
    const players = document.getElementById("players");
    const roomCode = document.getElementById("roomCode");
    const roleBox = document.getElementById("roleBox");
    const hideRoleBtn = document.getElementById("hideRoleBtn");

    const homeMessage = document.getElementById("homeMessage");
    const lobbyMessage = document.getElementById("lobbyMessage");
    const hostControls = document.getElementById("hostControls");

    const chatBox = document.getElementById("chatBox");
    const msgInput = document.getElementById("msgInput");
    const sendMsgBtn = document.getElementById("sendMsgBtn");
    const chatError = document.getElementById("chatError");
    const sidebarPlayers = document.getElementById("sidebarPlayers");
    const hostVoteBtn = document.getElementById("hostVoteBtn");
    const votesList = document.getElementById("votesList");

    const voteOptions = document.getElementById("voteOptions");
    const animalChoices = document.getElementById("animalChoices");
    const outsiderRevealBanner = document.getElementById("outsiderRevealBanner");
    const guessStatus = document.getElementById("guessStatus");

    const scoresList = document.getElementById("scoresList");
    const readyNextBtn = document.getElementById("readyNextBtn");
    const hostForceStartBtn = document.getElementById("hostForceStartBtn");

    let currentRoom = null;
    let isHost = false;
    let isSpectator = false;
    let allPlayersList = [];

    function showScreen(screen) {
      home.classList.add("hidden");
      lobby.classList.add("hidden");
      roleScreen.classList.add("hidden");
      chatScreen.classList.add("hidden");
      voteScreen.classList.add("hidden");
      guessScreen.classList.add("hidden");
      scoreScreen.classList.add("hidden");
      screen.classList.remove("hidden");
    }

    showCreateBtn.addEventListener("click", () => {
      joinBox.classList.add("hidden");
      spectateBox.classList.add("hidden");
      createBox.classList.toggle("hidden");
    });

    showJoinBtn.addEventListener("click", () => {
      createBox.classList.add("hidden");
      spectateBox.classList.add("hidden");
      joinBox.classList.toggle("hidden");
    });

    showSpectateBtn.addEventListener("click", () => {
      createBox.classList.add("hidden");
      joinBox.classList.add("hidden");
      spectateBox.classList.toggle("hidden");
    });

    createBtn.addEventListener("click", () => {
      const name = nameInput.value.trim();
      const pin = pinInput.value.trim();
      if (!name || !pin) return homeMessage.textContent = "ادخل الاسم ورقم المالك";

      socket.emit("create-room", { name, pin }, (res) => {
        if (!res.success) return homeMessage.textContent = res.message;
        currentRoom = res.roomCode;
        isHost = true;
        roomCode.textContent = currentRoom;
        hostControls.classList.remove("hidden");
        hostVoteBtn.classList.remove("hidden");
        hostForceStartBtn.classList.remove("hidden");
        showScreen(lobby);
      });
    });

    joinBtn.addEventListener("click", () => {
      const name = nameInput.value.trim();
      const code = roomInput.value.trim();
      if (!name || !code) return homeMessage.textContent = "ادخل الاسم والكود";

      socket.emit("join-room", { name, roomCode: code }, (res) => {
        if (!res.success) return homeMessage.textContent = res.message;
        currentRoom = res.roomCode;
        isHost = res.isHost;
        roomCode.textContent = currentRoom;
        if (isHost) {
          hostControls.classList.remove("hidden");
          hostVoteBtn.classList.remove("hidden");
          hostForceStartBtn.classList.remove("hidden");
        }
        showScreen(lobby);
      });
    });

    spectateBtn.addEventListener("click", () => {
      const code = spectateRoomInput.value.trim();
      if (!code) return;

      socket.emit("spectate-room", { roomCode: code }, (res) => {
        if (!res.success) return homeMessage.textContent = res.message;
        currentRoom = res.roomCode;
        isSpectator = true;
        document.getElementById("chatInputArea").classList.add("hidden");
        showScreen(chatScreen);
      });
    });

    socket.on("players:update", (playerList) => {
      allPlayersList = playerList;
      players.innerHTML = "";
      sidebarPlayers.innerHTML = "";

      playerList.forEach((p) => {
        const div = document.createElement("div");
        div.className = "player";
        div.textContent = `👤 ${p.name} ${p.ready ? '✅ (جاهز)' : ''}`;
        players.appendChild(div);

        const sideDiv = document.createElement("div");
        sideDiv.className = "sidebar-player";
        let controls = (isHost && p.id !== socket.id) ? `
          <div class="sidebar-controls">
            <button class="btn-ctrl btn-allow" onclick="toggleMute('${p.id}', false)">🔊</button>
            <button class="btn-ctrl btn-mute" onclick="toggleMute('${p.id}', true)">🔇</button>
          </div>
        ` : "";

        sideDiv.innerHTML = `<span>👤 ${p.name} (نقاطه: ${p.score})</span>` + controls;
        sidebarPlayers.appendChild(sideDiv);
      });
    });

    function toggleMute(targetId, muteState) {
      socket.emit("toggle-mute", { roomCode: currentRoom, targetId, muteState });
    }

    startBtn.addEventListener("click", () => {
      socket.emit("start-game", { roomCode: currentRoom }, (res) => {
        if (!res.success) lobbyMessage.textContent = res.message;
      });
    });

    hostForceStartBtn.addEventListener("click", () => {
      socket.emit("start-game", { roomCode: currentRoom }, (res) => {
        if (!res.success) alert(res.message);
      });
    });

    socket.on("game:role", (data) => {
      if (data.role === "outsider") {
        roleBox.innerHTML = `🚨<br><strong>أنت برا السالفة</strong>`;
      } else {
        roleBox.innerHTML = `🐾<br><strong>الحيوان هو:</strong><div class="animal">${data.animal}</div>`;
      }
      showScreen(roleScreen);
    });

    hideRoleBtn.addEventListener("click", () => showScreen(chatScreen));

    hostVoteBtn.addEventListener("click", () => {
      socket.emit("start-voting-phase", { roomCode: currentRoom });
    });

    socket.on("vote:start", () => {
      if (isSpectator) {
        showScreen(chatScreen);
        return;
      }

      voteOptions.innerHTML = "";
      const candidates = allPlayersList.filter(p => p.id !== socket.id);

      candidates.forEach(p => {
        const btn = document.createElement("button");
        btn.textContent = "👤 " + p.name;
        btn.onclick = () => {
          socket.emit("submit-vote", { roomCode: currentRoom, targetId: p.id });
          showScreen(chatScreen);
        };
        voteOptions.appendChild(btn);
      });

      showScreen(voteScreen);
    });

    socket.on("vote:update-live", (votes) => {
      votesList.innerHTML = "";
      votes.forEach(v => {
        const div = document.createElement("div");
        div.className = "vote-item";
        div.textContent = `👈 ${v.voterName} صوت لـ : ${v.targetName}`;
        votesList.appendChild(div);
      });
    });

    socket.on("vote:completed", ({ outsiderName, outsiderId, choices }) => {
      outsiderRevealBanner.innerHTML = `🚨 الشخص الذي كان برا السالفة هو: <strong>${outsiderName}</strong>`;
      animalChoices.innerHTML = "";

      const isMeOutsider = (socket.id === outsiderId);

      if (isMeOutsider) {
        guessStatus.textContent = "🎯 اختر الحيوان الذي تعتقد أنه كان السالفة:";
      } else {
        guessStatus.textContent = "👀 شاهد الآن ماذا سيختار الشخص الذي برا السالفة...";
      }

      choices.forEach(animalName => {
        const btn = document.createElement("button");
        btn.textContent = animalName;
        btn.dataset.animal = animalName;

        if (!isMeOutsider) {
          btn.disabled = true;
        } else {
          btn.onclick = () => {
            socket.emit("guess-animal", { roomCode: currentRoom, chosenAnimal: animalName });
          };
        }

        animalChoices.appendChild(btn);
      });

      showScreen(guessScreen);
    });

    // استقبال النتيجة وعرض جدول النقاط المتراكمة
    socket.on("guess:result", ({ chosenAnimal, correctAnimal, isCorrect, roundSummary }) => {
      const buttons = animalChoices.querySelectorAll("button");
      buttons.forEach(btn => {
        btn.disabled = true;
        if (btn.dataset.animal === chosenAnimal) {
          btn.className = isCorrect ? "correct-btn" : "wrong-btn";
        }
      });

      // الانتقال لتصفح لوحة النقاط بعد ثانيتين لمشاهدة التخمين
      setTimeout(() => {
        scoresList.innerHTML = "";
        
        roundSummary.sort((a, b) => b.totalScore - a.totalScore); // ترتيب المتصدرين بالأعلى

        roundSummary.forEach(p => {
          const div = document.createElement("div");
          div.className = "score-card";
          div.innerHTML = `
            <div>
              <strong>👤 ${p.name}</strong>
              <div style="font-size:12px; color:#cbd5e1;">نقاط هذه الجولة: +${p.earnedScore}</div>
            </div>
            <div class="score-badge">المجموع: <span class="score-total">${p.totalScore}</span></div>
          `;
          scoresList.appendChild(div);
        });

        readyNextBtn.disabled = false;
        readyNextBtn.textContent = "✅ أكمل جولة ثانية";

        showScreen(scoreScreen);
      }, 2500);
    });

    readyNextBtn.addEventListener("click", () => {
      socket.emit("player-ready", { roomCode: currentRoom });
      readyNextBtn.disabled = true;
      readyNextBtn.textContent = "⏳ بانتظار بقية اللاعبين والمالك...";
    });

    function sendMessage() {
      if (isSpectator) return;
      const text = msgInput.value.trim();
      if (!text) return;

      socket.emit("send-message", { roomCode: currentRoom, message: text }, (res) => {
        if (res && !res.success) {
          chatError.textContent = res.message;
        } else {
          msgInput.value = "";
        }
      });
    }

    sendMsgBtn.addEventListener("click", sendMessage);
    msgInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendMessage();
    });

    socket.on("chat:message", (data) => {
      const msgDiv = document.createElement("div");
      const isMe = (data.senderId === socket.id);

      msgDiv.className = isMe ? "chat-msg my-msg" : "chat-msg";
      msgDiv.innerHTML = `<span class="sender-name">${isMe ? "أنت" : data.sender}</span><div>${data.message}</div>`;

      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    });
  </script>
</body>
</html>
