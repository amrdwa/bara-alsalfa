<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>برا السالفة 🎭</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      font-family: Arial, sans-serif;

      background:
        radial-gradient(circle at top, #273c75, #111827 55%, #050505);

      color: white;
    }

    .container {
      width: min(92%, 500px);

      background: rgba(0, 0, 0, 0.55);

      border: 1px solid rgba(255,255,255,0.12);

      border-radius: 25px;

      padding: 30px;

      text-align: center;

      box-shadow:
        0 20px 60px rgba(0,0,0,0.5);
    }

    h1 {
      font-size: 42px;
      margin: 0 0 10px;
    }

    .subtitle {
      color: #cbd5e1;
      margin-bottom: 30px;
    }

    input {
      width: 100%;

      padding: 15px;

      border-radius: 12px;

      border: none;
      outline: none;

      font-size: 18px;

      text-align: center;

      margin-bottom: 12px;
    }

    button {
      width: 100%;

      padding: 15px;

      margin-top: 10px;

      border: none;

      border-radius: 12px;

      background: #5865f2;

      color: white;

      font-size: 18px;

      font-weight: bold;

      cursor: pointer;
    }

    button:hover {
      background: #4752c4;
    }

    .secondary {
      background: #374151;
    }

    .secondary:hover {
      background: #4b5563;
    }

    .hidden {
      display: none;
    }

    .room-code {
      font-size: 42px;

      font-weight: bold;

      letter-spacing: 8px;

      color: #60a5fa;

      margin: 20px 0;
    }

    .players {
      margin-top: 20px;

      display: flex;

      flex-direction: column;

      gap: 10px;
    }

    .player {
      padding: 12px;

      background: rgba(255,255,255,0.08);

      border-radius: 10px;
    }

    .status {
      margin: 20px 0;

      color: #cbd5e1;
    }

    .role {
      font-size: 28px;

      margin: 25px 0;

      padding: 25px;

      border-radius: 20px;

      background: rgba(255,255,255,0.08);
    }

    .animal {
      font-size: 48px;

      margin-top: 15px;
    }

    .error {
      color: #f87171;

      margin-top: 15px;
    }

    .success {
      color: #4ade80;

      margin-top: 15px;
    }
  </style>
</head>

<body>

  <!-- الشاشة الرئيسية -->

  <div class="container" id="home">

    <h1>🎭</h1>

    <h1>برا السالفة</h1>

    <div class="subtitle">
      لعبة جماعية بين الأصدقاء
    </div>

    <input
      id="nameInput"
      type="text"
      placeholder="اكتب اسمك"
      maxlength="20"
    >

    <button id="createBtn">
      🏠 إنشاء غرفة
    </button>

    <button
      id="showJoinBtn"
      class="secondary"
    >
      🔑 دخول إلى غرفة
    </button>

    <div
      id="joinBox"
      class="hidden"
    >

      <input
        id="roomInput"
        type="text"
        placeholder="كود الغرفة"
        maxlength="4"
      >

      <button id="joinBtn">
        دخول
      </button>

    </div>

    <div
      id="homeMessage"
      class="error"
    ></div>

  </div>


  <!-- غرفة الانتظار -->

  <div
    class="container hidden"
    id="lobby"
  >

    <h1>🏠 الغرفة</h1>

    <div
      id="roomCode"
      class="room-code"
    ></div>

    <div class="status">
      أرسل كود الغرفة لأصحابك
    </div>

    <h3>👥 اللاعبين</h3>

    <div
      id="players"
      class="players"
    ></div>

    <div
      id="hostControls"
      class="hidden"
    >

      <button id="startBtn">
        🚀 ابدأ اللعبة
      </button>

    </div>

    <div
      id="lobbyMessage"
      class="error"
    ></div>

  </div>


  <!-- شاشة الدور -->

  <div
    class="container hidden"
    id="roleScreen"
  >

    <h1>🔒 دورك</h1>

    <div
      id="roleBox"
      class="role"
    ></div>

    <div class="status">
      لا تورجي شاشتك لأي لاعب 🤫
    </div>

    <button id="hideRoleBtn">
      👀 فهمت
    </button>

  </div>


  <!-- شاشة الانتظار -->

  <div
    class="container hidden"
    id="waitingScreen"
  >

    <h1>🎭 الجولة بدأت</h1>

    <div class="status">
      الآن اذهبوا للجروب الخارجي وتناقشوا.
    </div>

    <p>
      عندما تنتهوا من النقاش،
      ارجعوا إلى اللعبة.
    </p>

  </div>


  <script src="/socket.io/socket.io.js"></script>

  <script>

    const socket = io();

    const home = document.getElementById("home");

    const lobby = document.getElementById("lobby");

    const roleScreen =
      document.getElementById("roleScreen");

    const waitingScreen =
      document.getElementById("waitingScreen");

    const nameInput =
      document.getElementById("nameInput");

    const roomInput =
      document.getElementById("roomInput");

    const createBtn =
      document.getElementById("createBtn");

    const showJoinBtn =
      document.getElementById("showJoinBtn");

    const joinBox =
      document.getElementById("joinBox");

    const joinBtn =
      document.getElementById("joinBtn");

    const startBtn =
      document.getElementById("startBtn");

    const players =
      document.getElementById("players");

    const roomCode =
      document.getElementById("roomCode");

    const roleBox =
      document.getElementById("roleBox");

    const hideRoleBtn =
      document.getElementById("hideRoleBtn");

    const homeMessage =
      document.getElementById("homeMessage");

    const lobbyMessage =
      document.getElementById("lobbyMessage");

    const hostControls =
      document.getElementById("hostControls");


    let currentRoom = null;

    let isHost = false;


    function showScreen(screen) {

      home.classList.add("hidden");

      lobby.classList.add("hidden");

      roleScreen.classList.add("hidden");

      waitingScreen.classList.add("hidden");

      screen.classList.remove("hidden");

    }


    showJoinBtn.addEventListener("click", () => {

      joinBox.classList.toggle("hidden");

    });


    createBtn.addEventListener("click", () => {

      const name =
        nameInput.value.trim();

      if (!name) {

        homeMessage.textContent =
          "اكتب اسمك أولًا";

        return;

      }

      socket.emit(
        "create-room",
        { name },

        (response) => {

          if (!response.success) {

            homeMessage.textContent =
              response.message;

            return;

          }

          currentRoom =
            response.roomCode;

          isHost =
            response.isHost;

          roomCode.textContent =
            currentRoom;

          hostControls.classList.remove(
            "hidden"
          );

          showScreen(lobby);

        }
      );

    });


    joinBtn.addEventListener("click", () => {

      const name =
        nameInput.value.trim();

      const code =
        roomInput.value.trim();

      if (!name) {

        homeMessage.textContent =
          "اكتب اسمك أولًا";

        return;

      }

      if (!code) {

        homeMessage.textContent =
          "اكتب كود الغرفة";

        return;

      }

      socket.emit(
        "join-room",
        {
          name,
          roomCode: code
        },

        (response) => {

          if (!response.success) {

            homeMessage.textContent =
              response.message;

            return;

          }

          currentRoom =
            response.roomCode;

          isHost =
            response.isHost;

          roomCode.textContent =
            currentRoom;

          if (isHost) {

            hostControls.classList.remove(
              "hidden"
            );

          }

          showScreen(lobby);

        }
      );

    });


    socket.on(
      "players:update",
      (playerList) => {

        players.innerHTML = "";

        playerList.forEach(
          (player) => {

            const div =
              document.createElement("div");

            div.className =
              "player";

            div.textContent =
              "👤 " + player.name;

            players.appendChild(div);

          }
        );

      }
    );


    startBtn.addEventListener("click", () => {

      socket.emit(
        "start-game",
        {
          roomCode: currentRoom
        },

        (response) => {

          if (!response.success) {

            lobbyMessage.textContent =
              response.message;

          }

        }
      );

    });


    socket.on(
      "game:role",
      (data) => {

        if (data.role === "outsider") {

          roleBox.innerHTML = `
            🚨<br>
            <strong>أنت برا السالفة</strong>
          `;

        } else {

          roleBox.innerHTML = `
            🐾<br>
            <strong>الحيوان هو:</strong>
            <div class="animal">
              ${data.animal}
            </div>
          `;

        }

        showScreen(roleScreen);

      }
    );


    socket.on(
      "game:started",
      () => {

        console.log(
          "Game started"
        );

      }
    );


    hideRoleBtn.addEventListener(
      "click",
      () => {

        showScreen(waitingScreen);

      }
    );

  </script>

</body>
</html>
