<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>برا السالفة 🎭</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #273c75, #111827 55%, #050505);
      color: white;
    }
    .container {
      width: min(92%, 500px);
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 25px;
      padding: 30px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .chat-layout {
      width: min(95%, 850px);
      display: flex;
      gap: 20px;
    }
    @media (max-width: 768px) {
      .chat-layout { flex-direction: column; }
    }
    h1 { font-size: 38px; margin: 0 0 10px; }
    .subtitle { color: #cbd5e1; margin-bottom: 25px; }
    input {
      width: 100%; padding: 15px; border-radius: 12px;
      border: none; outline: none; font-size: 18px;
      text-align: center; margin-bottom: 12px;
    }
    button {
      width: 100%; padding: 15px; margin-top: 10px;
      border: none; border-radius: 12px; background: #5865f2;
      color: white; font-size: 18px; font-weight: bold; cursor: pointer;
    }
    button:hover { background: #4752c4; }
    .secondary { background: #374151; }
    .secondary:hover { background: #4b5563; }
    .spectate-btn { background: #059669; }
    .spectate-btn:hover { background: #047857; }
    .hidden { display: none !important; }
    .room-code { font-size: 42px; font-weight: bold; letter-spacing: 8px; color: #60a5fa; margin: 20px 0; }
    .players { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
    .player { padding: 12px; background: rgba(255,255,255,0.08); border-radius: 10px; }
    .status { margin: 15px 0; color: #cbd5e1; }
    .role { font-size: 28px; margin: 25px 0; padding: 25px; border-radius: 20px; background: rgba(255,255,255,0.08); }
    .animal { font-size: 48px; margin-top: 15px; }
    .error { color: #f87171; margin-top: 15px; }
    .box-container { margin-top: 15px; padding: 15px; background: rgba(255, 255, 255, 0.05); border-radius: 15px; }

    .chat-main { flex: 2; }
    .sidebar { flex: 1; text-align: right; }
    
    .chat-box {
      height: 350px;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 15px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 15px;
    }

    .chat-msg {
      align-self: flex-start;
      max-width: 80%;
      background: rgba(255, 255, 255, 0.12);
      padding: 10px 14px;
      border-radius: 15px 15px 15px 2px;
      word-break: break-word;
      font-size: 15px;
      text-align: right;
    }
    .chat-msg .sender-name {
      font-weight: bold;
      color: #60a5fa;
      font-size: 13px;
      margin-bottom: 3px;
      display: block;
    }

    .chat-msg.my-msg {
      align-self: flex-end;
      background: #2563eb;
      border-radius: 15px 15px 2px 15px;
      text-align: left;
    }
    .chat-msg.my-msg .sender-name {
      color: #93c5fd;
    }

    .chat-input-container { display: flex; gap: 10px; }
    .chat-input-container input { margin-bottom: 0; text-align: right; }
    .chat-input-container button { margin-top: 0; width: 100px; flex-shrink: 0; }

    .sidebar-player {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.08);
      padding: 10px 12px;
      border-radius: 10px;
      margin-bottom: 10px;
      font-size: 14px;
    }
    .sidebar-controls { display: flex; gap: 5px; }
    .btn-ctrl {
      padding: 5px 8px;
      font-size: 12px;
      border-radius: 6px;
      margin-top: 0;
      width: auto;
    }
    .btn-allow { background: #10b981; }
    .btn-allow:hover { background: #059669; }
    .btn-mute { background: #ef4444; }
    .btn-mute:hover { background: #dc2626; }
    .muted-badge { color: #ef4444; font-size: 12px; font-weight: bold; }
    
    .spectator-banner {
      background: #059669;
      color: white;
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 10px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- الشاشة الرئيسية -->
  <div class="container" id="home">
    <h1>🎭</h1>
    <h1>برا السالفة</h1>
    <div class="subtitle">لعبة جماعية بين الأصدقاء</div>

    <input id="nameInput" type="text" placeholder="اكتب اسمك" maxlength="20">

    <button id="showCreateBtn">🏠 إنشاء غرفة</button>

    <div id="createBox" class="box-container hidden">
      <input id="pinInput" type="password" placeholder="🔐 كلمة سر المالك">
      <button id="createBtn">تأكيد وإنشاء الغرفة</button>
    </div>

    <button id="showJoinBtn" class="secondary">🔑 دخول إلى غرفة</button>

    <div id="joinBox" class="box-container hidden">
      <input id="roomInput" type="text" placeholder="كود الغرفة" maxlength="4">
      <button id="joinBtn">دخول كـ لاعب</button>
    </div>

    <!-- خيار المشاهدة الجديد -->
    <button id="showSpectateBtn" class="spectate-btn">👁️ مشاهدة لعبة</button>

    <div id="spectateBox" class="box-container hidden">
      <input id="spectateRoomInput" type="text" placeholder="كود اللعبة للمشاهدة" maxlength="4">
      <button id="spectateBtn" class="spectate-btn">دخول للمشاهدة 👁️</button>
    </div>

    <div id="homeMessage" class="error"></div>
  </div>

  <!-- غرفة الانتظار -->
  <div class="container hidden" id="lobby">
    <h1>🏠 الغرفة</h1>
    <div id="roomCode" class="room-code"></div>
    <div class="status">أرسل كود الغرفة لأصحابك</div>

    <h3>👥 اللاعبين</h3>
    <div id="players" class="players"></div>

    <div id="hostControls" class="hidden">
      <button id="startBtn">🚀 ابدأ اللعبة</button>
    </div>

    <div id="lobbyMessage" class="error"></div>
  </div>

  <!-- شاشة الدور -->
  <div class="container hidden" id="roleScreen">
    <h1>🔒 دورك</h1>
    <div id="roleBox" class="role"></div>
    <div class="status">لا تورجي شاشتك لأي لاعب 🤫</div>
    <button id="hideRoleBtn">👀 فهمت</button>
  </div>

  <!-- شاشة المحادثة والتحكم -->
  <div class="container chat-layout hidden" id="chatScreen">
    <div class="sidebar">
      <h3>👥 قائمة اللاعبين</h3>
      <div id="sidebarPlayers"></div>
    </div>

    <div class="chat-main">
      <h1>💬 المحادثة</h1>
      <div id="spectatorBanner" class="spectator-banner hidden">👁️ أنت الآن في وضع المشاهدة فقط</div>
      <div class="status" id="chatStatus">تناقشوا واكتشفوا مين برا السالفة!</div>

      <div id="chatBox" class="chat-box"></div>

      <div class="chat-input-container" id="chatInputArea">
        <input id="msgInput" type="text" placeholder="اكتب رسالتك..." maxlength="100">
        <button id="sendMsgBtn">إرسال</button>
      </div>
      <div id="chatError" class="error"></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    const home = document.getElementById("home");
    const lobby = document.getElementById("lobby");
    const roleScreen = document.getElementById("roleScreen");
    const chatScreen = document.getElementById("chatScreen");

    const nameInput = document.getElementById("nameInput");
    const pinInput = document.getElementById("pinInput");
    const roomInput = document.getElementById("roomInput");

    const showCreateBtn = document.getElementById("showCreateBtn");
    const createBox = document.getElementById("createBox");
    const createBtn = document.getElementById("createBtn");

    const showJoinBtn = document.getElementById("showJoinBtn");
    const joinBox = document.getElementById("joinBox");
    const joinBtn = document.getElementById("joinBtn");

    const showSpectateBtn = document.getElementById("showSpectateBtn");
    const spectateBox = document.getElementById("spectateBox");
    const spectateRoomInput = document.getElementById("spectateRoomInput");
    const spectateBtn = document.getElementById("spectateBtn");

    const startBtn = document.getElementById("startBtn");
    const players = document.getElementById("players");
    const roomCode = document.getElementById("roomCode");
    const roleBox = document.getElementById("roleBox");
    const hideRoleBtn = document.getElementById("hideRoleBtn");

    const homeMessage = document.getElementById("homeMessage");
    const lobbyMessage = document.getElementById("lobbyMessage");
    const hostControls = document.getElementById("hostControls");

    const chatBox = document.getElementById("chatBox");
    const msgInput = document.getElementById("msgInput");
    const sendMsgBtn = document.getElementById("sendMsgBtn");
    const chatError = document.getElementById("chatError");
    const sidebarPlayers = document.getElementById("sidebarPlayers");
    const chatInputArea = document.getElementById("chatInputArea");
    const spectatorBanner = document.getElementById("spectatorBanner");

    let currentRoom = null;
    let isHost = false;
    let isSpectator = false;

    function showScreen(screen) {
      home.classList.add("hidden");
      lobby.classList.add("hidden");
      roleScreen.classList.add("hidden");
      chatScreen.classList.add("hidden");
      screen.classList.remove("hidden");
    }

    showCreateBtn.addEventListener("click", () => {
      joinBox.classList.add("hidden");
      spectateBox.classList.add("hidden");
      createBox.classList.toggle("hidden");
    });

    showJoinBtn.addEventListener("click", () => {
      createBox.classList.add("hidden");
      spectateBox.classList.add("hidden");
      joinBox.classList.toggle("hidden");
    });

    showSpectateBtn.addEventListener("click", () => {
      createBox.classList.add("hidden");
      joinBox.classList.add("hidden");
      spectateBox.classList.toggle("hidden");
    });

    createBtn.addEventListener("click", () => {
      homeMessage.textContent = "";
      const name = nameInput.value.trim();
      const pin = pinInput.value.trim();

      if (!name) return homeMessage.textContent = "اكتب اسمك أولًا";
      if (!pin) return homeMessage.textContent = "أدخل كلمة سر المالك";

      socket.emit("create-room", { name, pin }, (response) => {
        if (!response.success) return homeMessage.textContent = response.message;
        currentRoom = response.roomCode;
        isHost = response.isHost;
        roomCode.textContent = currentRoom;
        hostControls.classList.remove("hidden");
        showScreen(lobby);
      });
    });

    joinBtn.addEventListener("click", () => {
      homeMessage.textContent = "";
      const name = nameInput.value.trim();
      const code = roomInput.value.trim();

      if (!name) return homeMessage.textContent = "اكتب اسمك أولًا";
      if (!code) return homeMessage.textContent = "اكتب كود الغرفة";

      socket.emit("join-room", { name, roomCode: code }, (response) => {
        if (!response.success) return homeMessage.textContent = response.message;
        currentRoom = response.roomCode;
        isHost = response.isHost;
        roomCode.textContent = currentRoom;
        if (isHost) hostControls.classList.remove("hidden");
        showScreen(lobby);
      });
    });

    // حدث زر المشاهدة
    spectateBtn.addEventListener("click", () => {
      homeMessage.textContent = "";
      const code = spectateRoomInput.value.trim();

      if (!code) return homeMessage.textContent = "ادخل كود اللعبة للمشاهدة";

      socket.emit("spectate-room", { roomCode: code }, (response) => {
        if (!response.success) return homeMessage.textContent = response.message;
        currentRoom = response.roomCode;
        isSpectator = true;
        
        // إخفاء صندوق الإرسال وإظهار بنر المشاهدة
        chatInputArea.classList.add("hidden");
        spectatorBanner.classList.remove("hidden");

        showScreen(chatScreen);
      });
    });

    socket.on("players:update", (playerList) => {
      players.innerHTML = "";
      sidebarPlayers.innerHTML = "";

      playerList.forEach((player) => {
        const div = document.createElement("div");
        div.className = "player";
        div.textContent = "👤 " + player.name;
        players.appendChild(div);

        const sideDiv = document.createElement("div");
        sideDiv.className = "sidebar-player";
        
        let playerInfo = `<span>👤 ${player.name} ${player.isMuted ? '<span class="muted-badge">(مكتوم)</span>' : ''}</span>`;
        
        let controls = "";
        if (isHost && player.id !== socket.id) {
          controls = `
            <div class="sidebar-controls">
              <button class="btn-ctrl btn-allow" onclick="toggleMute('${player.id}', false)">🔊 سماح</button>
              <button class="btn-ctrl btn-mute" onclick="toggleMute('${player.id}', true)">🔇 كتم</button>
            </div>
          `;
        }

        sideDiv.innerHTML = playerInfo + controls;
        sidebarPlayers.appendChild(sideDiv);
      });
    });

    function toggleMute(targetId, muteState) {
      socket.emit("toggle-mute", { roomCode: currentRoom, targetId, muteState });
    }

    startBtn.addEventListener("click", () => {
      socket.emit("start-game", { roomCode: currentRoom }, (response) => {
        if (!response.success) lobbyMessage.textContent = response.message;
      });
    });

    socket.on("game:role", (data) => {
      if (data.role === "outsider") {
        roleBox.innerHTML = `🚨<br><strong>أنت برا السالفة</strong>`;
      } else {
        roleBox.innerHTML = `🐾<br><strong>الحيوان هو:</strong><div class="animal">${data.animal}</div>`;
      }
      showScreen(roleScreen);
    });

    hideRoleBtn.addEventListener("click", () => {
      showScreen(chatScreen);
    });

    function sendMessage() {
      if (isSpectator) return;
      chatError.textContent = "";
      const text = msgInput.value.trim();
      if (!text) return;

      socket.emit("send-message", { roomCode: currentRoom, message: text }, (res) => {
        if (res && !res.success) {
          chatError.textContent = res.message;
        } else {
          msgInput.value = "";
        }
      });
    }

    sendMsgBtn.addEventListener("click", sendMessage);
    msgInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendMessage();
    });

    socket.on("chat:message", (data) => {
      const msgDiv = document.createElement("div");
      const isMe = (data.senderId === socket.id);

      msgDiv.className = isMe ? "chat-msg my-msg" : "chat-msg";
      
      msgDiv.innerHTML = `
        <span class="sender-name">${isMe ? "أنت" : data.sender}</span>
        <div>${data.message}</div>
      `;

      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    });
  </script>
</body>
</html>
